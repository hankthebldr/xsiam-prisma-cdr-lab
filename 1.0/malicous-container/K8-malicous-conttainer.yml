apiVersion: apps/v1
kind: Deployment
metadata:
  name: poc-detection-container
spec:
  replicas: 1
  selector:
    matchLabels:
      app: poc-detection
  template:
    metadata:
      labels:
        app: poc-detection
    spec:
      containers:
      - name: detection-container
        image: hreed014/cdr-xsiam-pc:1.0
      volumes:
      - name: script-volume
        emptyDir: {}
      - name: host-root
        hostPath:
          path: /
          type: Directory