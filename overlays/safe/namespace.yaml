apiVersion: v1
kind: Namespace
metadata:
  name: cdr-lab
  labels:
    name: cdr-lab
    cdr-lab/enabled: "true"
    # Pod Security Standards
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted  
    pod-security.kubernetes.io/warn: restricted
    # Network policies
    cdr-lab/network-policy: default-deny
  annotations:
    cdr-lab/description: "CDR Lab namespace with security hardening"
    cdr-lab/safety-mode: "safe"
    cdr-lab/created-by: "safe-overlay"
