name: CI

on:
  push:
    branches: [ main, develop, refactor/* ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        
    - name: Install linting tools
      run: |
        pip install yamllint
        sudo apt-get update
        sudo apt-get install -y shellcheck
        npm install -g markdownlint-cli
        
    - name: Lint shell scripts
      run: |
        find scripts hack -name "*.sh" -exec shellcheck {} +
        
    - name: Lint YAML files
      run: |
        yamllint -d relaxed scenarios/ overlays/ policies/ .github/
        
    - name: Lint Markdown files
      run: |
        markdownlint docs/ README.md
        
    - name: Check for typos
      uses: crate-ci/typos@master

  validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
        
    - name: Setup kustomize
      run: |
        curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        sudo mv kustomize /usr/local/bin/
        
    - name: Validate scenarios
      run: |
        for scenario in scenarios/v1.0/*/; do
          if [ -f "$scenario/kustomization.yaml" ]; then
            scenario_name=$(basename "$scenario")
            echo "Validating $scenario_name..."
            kustomize build "$scenario" | kubectl apply --dry-run=client -f - || exit 1
          fi
        done
        
    - name: Validate overlays
      run: |
        for overlay in overlays/*/; do
          if [ -f "$overlay/kustomization.yaml" ]; then
            overlay_name=$(basename "$overlay")
            echo "Validating $overlay_name overlay..."
            kustomize build "$overlay" | kubectl apply --dry-run=client -f - || exit 1
          fi
        done

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        
    - name: Run GitLeaks secret scanner
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

  test:
    name: Test Scenarios
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        scenario: [cryptominer, suid, container-escape]
        mode: [safe]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup KinD
      uses: helm/kind-action@v1.8.0
      with:
        cluster_name: cdr-lab-test
        config: hack/kind-config.yaml
        wait: 300s
        
    - name: Setup cluster
      run: |
        # Install metrics server for resource monitoring
        kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
        kubectl patch deployment metrics-server -n kube-system --type='json' -p='[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--kubelet-insecure-tls"}]'
        
        # Wait for metrics server
        kubectl wait --for=condition=available --timeout=300s deployment/metrics-server -n kube-system
        
    - name: Test scenario - ${{ matrix.scenario }}
      env:
        LAB_MODE: ${{ matrix.mode }}
        SCENARIO_ID: ${{ matrix.scenario }}
      run: |
        # Make scripts executable
        chmod +x scripts/*.sh hack/*.sh
        
        # Set timeout for the test
        timeout 10m bash -c "
          # Run the scenario
          if DRY_RUN=true scripts/run-scenario.sh $SCENARIO_ID $LAB_MODE; then
            echo 'Dry run successful for $SCENARIO_ID'
          else
            echo 'Dry run failed for $SCENARIO_ID'
            exit 1
          fi
        "
        
    - name: Smoke test - Deploy and verify
      if: matrix.scenario == 'cryptominer'
      run: |
        # Create namespace
        kubectl create namespace cdr-lab --dry-run=client -o yaml | kubectl apply -f -
        
        # Apply safe overlay
        kubectl apply -k overlays/safe/
        
        # Wait a moment for resources
        sleep 10
        
        # Check resources were created
        kubectl get all -n cdr-lab
        
        # Cleanup
        kubectl delete namespace cdr-lab --ignore-not-found=true

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check documentation completeness
      run: |
        # Check that all scenarios have documentation
        for scenario in scenarios/v1.0/*/; do
          scenario_name=$(basename "$scenario")
          if [ ! -f "$scenario/README.md" ]; then
            echo "Missing README.md for scenario: $scenario_name"
            missing=true
          fi
          if [ ! -f "$scenario/metadata.yaml" ]; then
            echo "Missing metadata.yaml for scenario: $scenario_name"
            missing=true
          fi
        done
        
        if [ "$missing" = "true" ]; then
          echo "Documentation check failed"
          exit 1
        fi
        
        echo "Documentation check passed"
        
    - name: Validate metadata files
      run: |
        for metadata_file in scenarios/v1.0/*/metadata.yaml; do
          echo "Validating $metadata_file"
          
          # Check required fields exist
          required_fields="id name version risk mitre_techniques"
          for field in $required_fields; do
            if ! grep -q "^$field:" "$metadata_file"; then
              echo "Missing required field '$field' in $metadata_file"
              exit 1
            fi
          done
        done
        
        echo "Metadata validation passed"

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [lint, validate, security-scan, test, docs]
    if: always()
    
    steps:
    - name: Summary
      run: |
        echo "## CI Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check job results
        if [ "${{ needs.lint.result }}" = "success" ]; then
          echo "✅ Linting: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Linting: FAILED" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.validate.result }}" = "success" ]; then
          echo "✅ Validation: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Validation: FAILED" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.security-scan.result }}" = "success" ]; then
          echo "✅ Security Scan: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Security Scan: FAILED" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.test.result }}" = "success" ]; then
          echo "✅ Tests: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Tests: FAILED" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.docs.result }}" = "success" ]; then
          echo "✅ Documentation: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Documentation: FAILED" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Overall Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
