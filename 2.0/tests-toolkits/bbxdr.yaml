apiVersion: v1
kind: Pod
metadata:
  name: busybox-script-runner
  labels:
    app: busybox-script
spec:
  containers:
  - name: busybox-script-container
    image: <your-dockerhub-username>/busybox-script:latest
    imagePullPolicy: Always
    command: ["/tmp/busybox_sample_download_script.sh"]
    volumeMounts:
    - name: script-volume
      mountPath: /tmp
  restartPolicy: Never
  volumes:
  - name: script-volume
    emptyDir: {}
