# This Kubernetes manifest file creates a deployment for running Aqua Security's Kube-Hunter
# from the GitHub repository: https://github.com/aquasecurity/kube-hunter
# This configuration ensures that all detections are enabled to simulate a comprehensive security audit.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqua-kube-hunter
  labels:
    app: aqua-kube-hunter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aqua-kube-hunter
  template:
    metadata:
      labels:
        app: aqua-kube-hunter
    spec:
      containers:
        - name: kube-hunter
          image: aquasec/kube-hunter:latest
          # Using latest is risky as it can introduce breaking changes
          imagePullPolicy: Always
          args:
            - "--pod"  # Run kube-hunter in pod mode to ensure full cluster scanning
            - "--quick"  # Quick mode enables detection without long pauses
          env:
            - name: KUBE_HUNTER_LOG_LEVEL
              value: "DEBUG"  # Set log level to DEBUG for detailed output
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: kubeconfig-volume
              mountPath: /root/.kube
              readOnly: true
      volumes:
        - name: kubeconfig-volume
          configMap:
            # Create a ConfigMap with a kubeconfig file for access
            name: kubeconfig
      serviceAccountName: default  # Service account for accessing cluster resources
      restartPolicy: OnFailure  # Restart only if the container fails
      nodeSelector:
        kubernetes.io/os: linux

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeconfig
  labels:
    app: aqua-kube-hunter
  namespace: default
# This ConfigMap is used to provide the kubeconfig required for kube-hunter to interact with the cluster
# Replace the value below with an actual kubeconfig for your cluster
  data:
    config: |
      apiVersion: v1
      kind: Config
      clusters:
      - name: my-cluster
        cluster:
          server: https://my-cluster-server-url
          certificate-authority-data: BASE64_ENCODED_CA_DATA
      contexts:
      - name: my-context
        context:
          cluster: my-cluster
          user: kube-hunter-user
      current-context: my-context
      users:
      - name: kube-hunter-user
        user:
          token: BASE64_ENCODED_TOKEN

---
# Exposing kube-hunter's metrics endpoint locally for monitoring
apiVersion: v1
kind: Service
metadata:
  name: kube-hunter-metrics
  labels:
    app: aqua-kube-hunter
spec:
  selector:
    app: aqua-kube-hunter
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8000  # Default kube-hunter metrics port
      nodePort: 30081  # Port available on the local machine for monitoring purposes
  type: NodePort  # Use NodePort to expose the service locally without using a LoadBalancer
