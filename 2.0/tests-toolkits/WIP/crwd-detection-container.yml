# This Kubernetes manifest file creates a deployment for running the CrowdStrike Detection Container
# from the GitHub repository: https://github.com/CrowdStrike/detection-container
# This example demonstrates a risky configuration to simulate a potential security incident scenario.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdstrike-detection
  labels:
    app: crowdstrike-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crowdstrike-detection
  template:
    metadata:
      labels:
        app: crowdstrike-detection
    spec:
      containers:
        - name: crowdstrike-detection
          image: crowdstrike/detection-container:latest
          # Using latest is risky because it can introduce breaking changes
          imagePullPolicy: Always
          securityContext:
            # Privileged escalation is dangerous and should not be enabled in production scenarios
            privileged: true
            capabilities:
              add:
                - NET_ADMIN  # Adding network capabilities can lead to severe container exploits
          env:
            - name: DETECTION_MODE
              value: "full"
            - name: RISKY_PARAM
              value: "true"  # Simulated risky configuration for testing detection capabilities
          volumeMounts:
            - name: host-volume
              mountPath: /host/data  # Mounting sensitive host directories inside container for risky simulation
              readOnly: false
          ports:
            - containerPort: 80  # Port to enable local port-forwarding
      volumes:
        - name: host-volume
          hostPath:
            # HostPath volumes allow direct access to the node's filesystem, which is risky and can lead to privilege escalation
            path: /etc
            type: Directory
      # Running with unrestricted service account which could be dangerous in real scenarios
      serviceAccountName: default
      hostNetwork: true  # Using the host network can expose container to risks like ARP poisoning
      dnsPolicy: ClusterFirstWithHostNet  # Using risky DNS configuration for testing purposes
      restartPolicy: Always
      tolerations:
        - key: "node-role.kubernetes.io/master"
          effect: "NoSchedule"  # Allowing scheduling on master nodes, which could pose risks in clusters
      nodeSelector:
        kubernetes.io/os: linux

---
# Exposing the container locally using NodePort to make it available on the local machine
apiVersion: v1
kind: Service
metadata:
  name: crowdstrike-detection-service
  labels:
    app: crowdstrike-detection
spec:
  selector:
    app: crowdstrike-detection
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 80
      nodePort: 30080  # Port available on the local machine for testing purposes
  type: NodePort  # Use NodePort to expose the service locally without using a LoadBalancer
