# This YAML demonstrates several insecure container scenarios commonly seen in the industry.
# It is intended for educational purposes only and should only be run in a secure, isolated environment.

apiVersion: v1
kind: Namespace
metadata:
  name: insecure-container-scenarios
---
# Scenario 1: Running a container with root privileges
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-root-container
  namespace: insecure-container-scenarios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insecure-root
  template:
    metadata:
      labels:
        app: insecure-root
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        securityContext:
          runAsUser: 0  # Running as root user, which is insecure
---
# Scenario 2: Running a container without resource limits (CPU, memory)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-resource-limits
  namespace: insecure-container-scenarios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: no-resource-limits
  template:
    metadata:
      labels:
        app: no-resource-limits
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        # No resource limits are defined here, which is insecure
---
# Scenario 3: Running a container with privilege escalation allowed
apiVersion: apps/v1
kind: Deployment
metadata:
  name: privileged-container
  namespace: insecure-container-scenarios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: privileged
  template:
    metadata:
      labels:
        app: privileged
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        securityContext:
          privileged: true  # Allowing privilege escalation
---
# Scenario 4: Running a container without dropping capabilities
apiVersion: apps/v1
kind: Deployment
metadata:
  name: full-capabilities-container
  namespace: insecure-container-scenarios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: full-capabilities
  template:
    metadata:
      labels:
        app: full-capabilities
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        securityContext:
          capabilities:
            add: ["ALL"]  # Adding all capabilities
---
# Scenario 5: Mounting sensitive host directories into the container
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensitive-mount
  namespace: insecure-container-scenarios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sensitive-mount
  template:
    metadata:
      labels:
        app: sensitive-mount
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        volumeMounts:
        - name: etc-mount
          mountPath: /mnt/etc
          readOnly: true
      volumes:
      - name: etc-mount
        hostPath:
          path: /etc  # Mounting sensitive host directory
          type: Directory
---
# Scenario 6: Running a container with an outdated and vulnerable image
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outdated-container
  namespace: insecure-container-scenarios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outdated
  template:
    metadata:
      labels:
        app: outdated
    spec:
      containers:
      - name: dvwa
        image: vulnerables/web-dvwa:latest  # Using outdated, vulnerable image
---
# Scenario 7: Storing credentials in environment variables
apiVersion: apps/v1
kind: Deployment
metadata:
  name: env-credentials
  namespace: insecure-container-scenarios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: env-credentials
  template:
    metadata:
      labels:
        app: env-credentials
    spec:
      containers:
      - name: mysql
        image: mysql:5.7
        env:
        - name: MYSQL_USER
          value: "root"
        - name: MYSQL_PASSWORD
          value: "password123"  # Storing credentials in environment variables
---
# Scenario 8: Running a container with an insecure network setting (host network mode)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: host-network-container
  namespace: insecure-container-scenarios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: host-network
  template:
    metadata:
      labels:
        app: host-network
    spec:
      hostNetwork: true  # Using host network mode
      containers:
      - name: nginx
        image: nginx:alpine
---
# Scenario 9: Running a container with read-write access to root filesystem
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rw-rootfs
  namespace: insecure-container-scenarios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rw-rootfs
  template:
    metadata:
      labels:
        app: rw-rootfs
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        volumeMounts:
        - name: rootfs
          mountPath: /mnt/rw-root
      volumes:
      - name: rootfs
        hostPath:
          path: /
          type: Directory
