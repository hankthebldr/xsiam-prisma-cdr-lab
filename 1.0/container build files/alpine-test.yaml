# This is a generic pod creation template that runs a generic apline image in way that you can exec into it 
apiVersion: v1
kind: Pod
metadata:
  name: alpine-persistent
  labels:
    app: alpine-test
spec:
  containers:
  - name: alpine
    image: alpine:latest
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    stdin: true
    tty: true
  restartPolicy: Always