apiVersion: v1
kind: Pod
metadata:
  name: wildfire-script-pod
  labels:
    app: wildfire-script
spec:
  containers:
  - name: wildfire-container
    image: ubuntu:latest
    command: ["/bin/bash", "-c", "--"]
    args: [
      "apt-get update && apt-get install -y wget curl && \
      mkdir -p /var/tmp/.hidden_wildfire_samples && \
      wget -q https://wildfire.paloaltonetworks.com/publicapi/test/pe -O /var/tmp/.hidden_wildfire_samples/test_pe.exe && \
      chmod +x /var/tmp/.hidden_wildfire_samples/test_pe.exe && \
      wget -q https://wildfire.paloaltonetworks.com/publicapi/test/apk -O /var/tmp/.hidden_wildfire_samples/test_apk.apk && \
      chmod +x /var/tmp/.hidden_wildfire_samples/test_apk.apk && \
      wget -q https://wildfire.paloaltonetworks.com/publicapi/test/macos -O /var/tmp/.hidden_wildfire_samples/test_macos.dmg && \
      chmod +x /var/tmp/.hidden_wildfire_samples/test_macos.dmg && \
      wget -q https://wildfire.paloaltonetworks.com/publicapi/test/elf -O /var/tmp/.hidden_wildfire_samples/test_elf.elf && \
      chmod +x /var/tmp/.hidden_wildfire_samples/test_elf.elf && \
      echo \"Listing downloaded files in /var/tmp/.hidden_wildfire_samples:\" && \
      ls -l /var/tmp/.hidden_wildfire_samples && \
      sleep 3600"
    ]
    securityContext:
      runAsUser: 0
  restartPolicy: Never